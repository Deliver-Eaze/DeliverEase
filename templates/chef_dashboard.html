<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen - DeliverEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .order-card {
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border-left: 8px solid #ffc107;
        }
        .order-card.preparing { border-left-color: #0dcaf0; }
        .order-card.ready { border-left-color: #198754; }
        .order-card.delayed { border-left-color: #dc3545; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">🍔 DeliverEase</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="/chef/">Kitchen</a>
                <a class="nav-link" href="/logout/">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <h1 class="mb-4">👨‍🍳 Active Orders</h1>

        <div id="message" class="alert d-none"></div>

        <div id="orders-container">
            <!-- JavaScript هيملاه -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/chef.js"></script>
