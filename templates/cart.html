<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .cart-item { border-left: 4px solid #0d6efd; border-radius: 8px; }
    </style>
</head>
<body>
    <!-- Navbar (Customer) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">🍔 FoodExpress</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
                    <li class="nav-item"><a class="nav-link active" href="cart.html"><i class="bi bi-cart"></i> Cart</a></li>
                    <li class="nav-item"><a class="nav-link" href="order-tracking.html">My Orders</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <h1 class="mb-4"><i class="bi bi-cart3"></i> Shopping Cart</h1>
        <div class="row">
            <div class="col-lg-8">
                <!-- Cart Item 1 -->
                <div class="card cart-item mb-3">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h5>Chicken Burger</h5>
                            <p class="text-muted mb-0">Price: $5.00</p>
                            <div class="d-flex align-items-center mt-2">
                                <a href="#" class="btn btn-sm btn-outline-secondary">−</a>
                                <span class="mx-2">2</span>
                                <a href="#" class="btn btn-sm btn-outline-secondary">+</a>
                            </div>
                        </div>
                        <div class="text-end">
                            <p class="fw-bold">$10.00</p>
                            <a href="#" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> Remove</a>
                        </div>
                    </div>
                </div>
                <!-- Cart Item 2 -->
                <div class="card cart-item mb-3">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h5>Cola</h5>
                            <p class="text-muted mb-0">Price: $1.50</p>
                            <div class="d-flex align-items-center mt-2">
                                <a href="#" class="btn btn-sm btn-outline-secondary">−</a>
                                <span class="mx-2">1</span>
                                <a href="#" class="btn btn-sm btn-outline-secondary">+</a>
                            </div>
                        </div>
                        <div class="text-end">
                            <p class="fw-bold">$1.50</p>
                            <a href="#" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> Remove</a>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Cart Summary -->
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h5>Cart Summary</h5>
                        <hr>
                        <div class="d-flex justify-content-between">
                            <span>Subtotal</span>
                            <span>$11.50</span>
                        </div>
                        <div class="d-flex justify-content-between">
                            <span>Delivery Fee</span>
                            <span>$2.00</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between fw-bold">
                            <span>Total</span>
                            <span>$13.50</span>
                        </div>
                        <a href="checkout.html" class="btn btn-primary w-100 mt-3">Proceed to Checkout</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/js/customer.js"></script>
</body>
</html>
