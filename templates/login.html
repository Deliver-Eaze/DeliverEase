<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DeliverEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        .login-card h2 {
            font-weight: 700;
            color: #333;
        }
        .btn-primary {
            padding: 14px;
            font-weight: 600;
            font-size: 16px;
            border-radius: 8px;
        }
        .form-control {
            padding: 12px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div style="font-size: 50px;">🍔</div>
            <h2>DeliverEase</h2>
            <p class="text-muted">Sign in to your account</p>
        </div>

        <!-- رسالة الخطأ أو النجاح -->
        <div id="message" class="alert d-none"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Enter your username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </form>

        <div class="text-center mt-4">
            <span class="text-muted">Don&apos;t have an account?</span>
            <a href="/register/" class="text-decoration-none fw-bold">Create one now</a>
        </div>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>
